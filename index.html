          <div><span>Apartar ahorro o pagar una deuda</span><b>+10</b></div>
          <div><span>Racha de 3 días · cada 7 días</span><b>+15 · +50</b></div>
          <div><span>Cumplir tu plan de ahorro del mes</span><b>+50</b></div>
          <div><span>Terminar un mes en verde</span><b>+30</b></div>
          <div><span>Completar una meta o una deuda</span><b>+100</b></div>
        </div>
        <p>Gastar no da brillo: lo que suma es anotar, ahorrar y pagar.</p>
      </div>
      <div class="section">
        <div class="section-head"><h2>Logros</h2><span>${p.logros.length} de ${LOGROS.length}</span></div>
        <div class="logros">${LOGROS.map((l) => logroHtml(l, p.logros.includes(l.id))).join("")}</div>
      </div>
      <div class="card">
        <h3>Protectores de racha · ${prot} de 2</h3>
        <p>Ganas uno cada 7 días seguidos. Si un día te olvidas de cerrar, se usa solo y no pierdes tu racha.</p>
      </div>`;
  }

  let celebTimer;
  function checkCelebrations() {
    const cel = document.getElementById("celebra");
    if (cel.open || sheet.open || editor.open || document.getElementById("progreso").open) return;
    const p = progreso();
    const vistos = new Set(state.logrosVistos || []);
    const nuevos = LOGROS.filter((l) => p.logros.includes(l.id) && !vistos.has(l.id));
    const subio = p.nivelIdx > (state.nivelVisto || 0);
    if (!nuevos.length && !subio) return;
    state.logrosVistos = [...new Set([...vistos, ...p.logros])];
    state.nivelVisto = Math.max(state.nivelVisto || 0, p.nivelIdx);
    save();
    const titulo = subio ? `¡Subiste a ${p.nivel.nombre}!` : nuevos.length === 1 ? "¡Logro desbloqueado!" : `¡${nuevos.length} logros desbloqueados!`;
    const texto = subio ? `Tienes ${p.xp} de brillo. ${p.siguiente ? `Siguiente: ${p.siguiente.nombre}.` : "Estás en lo más alto."}` : nuevos.length === 1 ? nuevos[0].texto : "Sigue así: cada día suma.";
    document.getElementById("celebraBody").innerHTML = `
      <div class="ribbon"></div>
      <div class="celebra-sun">${mascotSVG("celebra")}</div>
      <h2 id="celebraTitle">${titulo}</h2>
      <p>${texto}</p>
      <div class="celebra-items">${subio ? moneyArt(p.nivel) : ""}${nuevos.slice(0, 6).map((l) => logroHtml(l, true)).join("")}</div>
      <button type="button" class="btn accent block" data-close-celebra="1">¡Vamos!</button>`;
    if (typeof cel.showModal === "function") cel.showModal(); else cel.setAttribute("open", "");
    confeti({ host: cel });
    sonar("logro");
    vibrar([30, 50, 70]);
  }

  /* ---------- Meses ---------- */
  function getMonth(key, create) {
    if (!state.meses[key] && create) {
      state.meses[key] = {
        ingreso: state.ingresoBase,
        presupuesto: state.fijos.map((f) => ({ ...f })),
        movs: []
      };
    }
    return state.meses[key] || null;
  }

  // Si el mes no existe aún se muestra como plantilla, sin guardarlo hasta que haya un cambio.
  function monthView(key) {
    return getMonth(key, false) || { ingreso: state.ingresoBase, presupuesto: state.fijos.map((f) => ({ ...f })), movs: [], virtual: true };
  }

  function monthName(key, withYear = true) {
    const [y, mo] = key.split("-").map(Number);
    const name = new Date(y, mo - 1, 1).toLocaleDateString("es-PE", { month: "long" }).toLowerCase();
    return withYear ? `${name} ${y}` : name;
  }

  function shiftMonth(key, delta) {
    const [y, mo] = key.split("-").map(Number);
    const d = new Date(y, mo - 1 + delta, 1);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }

  function monthsBetween(from, to) {
    const [y1, m1] = from.split("-").map(Number);
    const [y2, m2] = to.split("-").map(Number);
    return (y2 - y1) * 12 + (m2 - m1);
  }

  function catName(m, id) {
    const p = m.presupuesto.find((x) => x.id === id) || state.fijos.find((x) => x.id === id) || EXTRA_CATS.find((x) => x.id === id);
    return p ? p.nombre : "Otros";
  }

  function movLabel(m, mv) {
    if (mv.tipo === "gasto") return catName(m, mv.cat);
    if (mv.tipo === "ingreso") return "Ingreso";
    if (mv.tipo === "ahorro") { const meta = state.metas.find((x) => x.id === metaOf(mv)); return meta ? `Ahorro · ${meta.nombre}` : "Ahorro"; }
    const d = state.deudas.find((x) => x.id === mv.deuda);
    return d ? `Pago · ${d.nombre}` : "Pago de deuda";
  }

  /* ---------- Metas ---------- */
  const defaultMetaId = () => (state.metas[0] ? state.metas[0].id : null);
  const metaOf = (mv) => (state.metas.some((x) => x.id === mv.meta) ? mv.meta : defaultMetaId());

  function ahorradoMeta(meta) {
    let t = Number(meta.base) || 0;
    for (const m of Object.values(state.meses)) for (const mv of m.movs) if (mv.tipo === "ahorro" && metaOf(mv) === meta.id) t += mv.monto;
    return t;
  }

  function totalAhorrado() {
    let t = state.metas.reduce((a, x) => a + (Number(x.base) || 0), 0);
    for (const m of Object.values(state.meses)) for (const mv of m.movs) if (mv.tipo === "ahorro") t += mv.monto;
    return t;
  }

  function metaInfo(meta, key) {
    const ahorrado = ahorradoMeta(meta);
    const faltan = Math.max(0, meta.objetivo - ahorrado);
    let mesesRest = 0, necesario = 0, vencida = false;
    if (meta.fecha && faltan > 0) {
      mesesRest = monthsBetween(key, meta.fecha) + 1;
      if (mesesRest < 1) vencida = true; else necesario = faltan / mesesRest;
    }
    return { ahorrado, faltan, mesesRest, necesario, vencida };
  }

  const esFondo = (meta) => meta.id === "fondo" || /emergencia/i.test(meta.nombre);

  /* ---------- Deudas ---------- */
  const minDe = (d) => Math.min(d.minimo || 0, d.saldo);
  const sumMinimos = (list) => list.reduce((a, d) => a + minDe(d), 0);
  const presupuestoDeudas = (list) => Math.max(state.deudaPresupuesto, sumMinimos(list));

  // Saldos como estaban al empezar el mes (se suman de vuelta los pagos de este mes).
  function deudasInicioMes() {
    const m = monthView(thisMonth());
    const pagado = {};
    for (const mv of m.movs) if (mv.tipo === "deuda") pagado[mv.deuda] = (pagado[mv.deuda] || 0) + (mv.aplicado != null ? mv.aplicado : mv.monto);
    const inicio = state.deudas.map((d) => ({ ...d, saldo: round2(d.saldo + (pagado[d.id] || 0)) })).filter((d) => d.saldo > 0.005);
    return { inicio, pagado };
  }

  function deudaPlanMes() {
    const { inicio } = deudasInicioMes();
    if (!inicio.length) return 0;
    return state.estrategia === "minimos" ? sumMinimos(inicio) : presupuestoDeudas(inicio);
  }

  // Simula mes a mes: interés mensual desde la TEA, mínimos a todas y el sobrante según la estrategia.
  function simulate(deudas, presupuesto, estrategia) {
    const ds = deudas.filter((d) => d.saldo > 0.005).map((d) => ({ id: d.id, saldo: d.saldo, tea: d.tea || 0, minimo: d.minimo || 0, r: Math.pow(1 + (d.tea || 0) / 100, 1 / 12) - 1 }));
    const res = { meses: 0, intereses: 0, payoff: {}, primerMes: {}, nunca: false, primeraCerrada: 0 };
    if (!ds.length) return res;
    const budget = estrategia === "minimos" ? Infinity : Math.max(presupuesto, sumMinimos(ds));
    let mes = 0;
    while (ds.some((d) => d.saldo > 0.005) && mes < 600) {
      mes++;
      const act = ds.filter((d) => d.saldo > 0.005);
      for (const d of act) { const i = d.saldo * d.r; d.saldo += i; res.intereses += i; }
      let avail = budget;
      const pay = {};
      for (const d of act) { const p = Math.min(d.minimo, d.saldo, avail); d.saldo -= p; avail -= p; pay[d.id] = p; }
      if (estrategia !== "minimos") {
        const orden = act.filter((d) => d.saldo > 0.005).sort(estrategia === "avalancha" ? (a, b) => b.tea - a.tea || a.saldo - b.saldo : (a, b) => a.saldo - b.saldo);
        for (const d of orden) { if (avail <= 0.005) break; const p = Math.min(d.saldo, avail); d.saldo -= p; avail -= p; pay[d.id] += p; }
      }
      if (mes === 1) res.primerMes = pay;
      for (const d of ds) if (d.saldo <= 0.005 && !res.payoff[d.id]) { d.saldo = 0; res.payoff[d.id] = mes; if (!res.primeraCerrada) res.primeraCerrada = mes; }
    }
    res.meses = mes;
    res.nunca = ds.some((d) => d.saldo > 0.005);
    return res;
  }

  function ordenEstrategia(list, estrategia) {
    const l = [...list];
    if (estrategia === "avalancha") l.sort((a, b) => b.tea - a.tea || a.saldo - b.saldo);
    else if (estrategia === "bola") l.sort((a, b) => a.saldo - b.saldo);
    return l;
  }

  function cuando(meses) {
    if (meses >= 600) return "más de 50 años";
    return `${meses} ${meses === 1 ? "mes" : "meses"} · ${monthName(shiftMonth(thisMonth(), meses - 1))}`;
  }

  /* ---------- Resumen del mes ---------- */
  function summary(m, key) {
    const spentBy = {};
    let ingresosExtra = 0, ahorro = 0, gastado = 0, deudaPagado = 0;
    for (const mv of m.movs) {
      if (mv.tipo === "gasto") { spentBy[mv.cat] = (spentBy[mv.cat] || 0) + mv.monto; gastado += mv.monto; }
      else if (mv.tipo === "ingreso") ingresosExtra += mv.monto;
      else if (mv.tipo === "ahorro") ahorro += mv.monto;
      else if (mv.tipo === "deuda") deudaPagado += mv.monto;
    }
    const budgetIds = new Set(m.presupuesto.map((p) => p.id));
    let fijosTotal = 0, fijosPagado = 0, comprometido = 0, excesoFijos = 0;
    for (const p of m.presupuesto) {
      const used = spentBy[p.id] || 0;
      fijosTotal += p.monto;
      fijosPagado += Math.min(used, p.monto);
      excesoFijos += Math.max(0, used - p.monto);
      comprometido += Math.max(used, p.monto);
    }
    let extra = 0;
    for (const [cat, v] of Object.entries(spentBy)) if (!budgetIds.has(cat)) extra += v;
    // Págate primero: el ahorro y las deudas planeadas se descuentan antes de lo libre (en meses pasados solo cuenta lo real).
    const past = key < thisMonth();
    const ahorroPlan = m.ahorroPlan != null ? m.ahorroPlan : state.ahorroMensual;
    const deudaPlan = past ? 0 : deudaPlanMes();
    const ahorroComp = Math.max(ahorro, past ? 0 : ahorroPlan);
    const deudaComp = Math.max(deudaPagado, deudaPlan);
    const ingresos = m.ingreso + ingresosExtra;
    const libre = ingresos - comprometido - extra - ahorroComp - deudaComp;
    return { spentBy, ingresos, ingresosExtra, ahorro, gastado, deudaPagado, deudaPlan, deudaComp, ahorroPlan, ahorroComp, fijosTotal, fijosPagado, fijosPendiente: fijosTotal - fijosPagado, excesoFijos, extra, libre };
  }

  function sugeridoAhorro(key) {
    const s = summary(monthView(key), key);
    const necesario = state.metas.reduce((a, meta) => a + metaInfo(meta, key).necesario, 0);
    const base = necesario > 0 ? necesario : s.ingresos * 0.1;
    const disponible = s.libre + s.ahorroComp;
    return Math.max(0, Math.min(Math.ceil(base / 10) * 10, Math.floor(disponible / 10) * 10));
  }

  /* ---------- Asesor ---------- */
  function consejos() {
    const key = current;
    const m = monthView(key);
    const s = summary(m, key);
    const out = [];
    const add = (p, nivel, titulo, texto, accion) => out.push({ p, nivel, titulo, texto, accion });
    const isNow = key === thisMonth();

    if (s.libre < 0) add(1, "bad", "Este mes no te alcanza", `Entre gastos fijos, deudas y el ahorro que planeaste te faltan <b>${money(-s.libre)}</b>. Baja el ahorro de este mes o recorta un gasto variable hasta cuadrar.`, { label: "Ajustar el plan", go: "plan" });

    const { inicio } = deudasInicioMes();
    const sumMin = sumMinimos(inicio);
    if (inicio.length && state.estrategia !== "minimos" && state.deudaPresupuesto > 0 && state.deudaPresupuesto < sumMin) {
      add(1, "bad", "Lo que pones para deudas no cubre los mínimos", `Las cuotas mínimas suman <b>${money(sumMin)}</b>. Si no pagas el mínimo te cobran mora e intereses extra, así que la app usa ese monto.`, { label: "Ajustar", go: "plan" });
    }

    for (const p of m.presupuesto) {
      const used = s.spentBy[p.id] || 0;
      if (p.monto > 0 && used > p.monto) add(2, "bad", `Te pasaste en ${esc(p.nombre)}`, `Llevas ${money(used)} de ${money(p.monto)} que tenías para esto.`);
    }

    if (isNow && s.ingresos > 0) {
      const hoy = new Date();
      const dia = hoy.getDate();
      const diasMes = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0).getDate();
      const restantes = diasMes - dia + 1;
      const paraVariables = s.libre + s.extra;
      const proyectado = dia >= 3 ? (s.extra / dia) * diasMes : 0;
      if (s.extra > 0 && proyectado > paraVariables && paraVariables > 0) {
        add(2, "warn", "A este ritmo te vas a pasar", `Llevas ${money(s.extra)} en gastos variables en ${dia} días. Si sigues igual cerrarías el mes en ${money(proyectado)}, ${money(proyectado - paraVariables)} más de lo que tienes. Para cuadrar, gasta máximo <b>${money(Math.max(0, s.libre) / restantes)} al día</b>.`);
      } else if (s.libre > 0) {
        add(8, "info", "Tu tope diario", `Te quedan ${money(s.libre)} para ${restantes} ${restantes === 1 ? "día" : "días"}: unos <b>${money(s.libre / restantes)} al día</b> para gustos, salidas y todo lo que no es fijo.`);
      }
    }

    if (inicio.length) {
      const cara = ordenEstrategia(inicio, "avalancha")[0];
      if (cara.tea >= 20) add(3, "warn", `Tu deuda más cara: ${esc(cara.nombre)}`, `Tiene una TEA de ${fmt.format(cara.tea)}%: cada S/ 100 que debes ahí te cuesta unos <b>${money(cara.tea)} al año</b>. Ningún ahorro común rinde eso. Después de juntar un colchón pequeño, lo extra debería ir aquí.`);
      const pres = presupuestoDeudas(inicio);
      const av = simulate(inicio, pres, "avalancha");
      const bo = simulate(inicio, pres, "bola");
      const mi = simulate(inicio, pres, "minimos");
      if (state.estrategia === "minimos") {
        if (mi.nunca) add(1, "bad", "Con solo mínimos no terminas de pagar", "Los intereses son más que tus cuotas mínimas, así que la deuda no baja. Pon más dinero al mes y elige Avalancha o Bola de nieve.", { label: "Ver deudas", go: "plan" });
        else if (mi.intereses - av.intereses > 1) add(3, "bad", "Pagar solo mínimos te sale caro", `Terminarías en ${mi.meses} meses pagando ${money(mi.intereses)} de intereses. Con Avalancha y ${money(pres)} al mes: ${av.meses} meses y ${money(av.intereses)}.`, { label: "Cambiar estrategia", go: "plan" });
      } else if (inicio.length >= 2) {
        const diff = bo.intereses - av.intereses;
        if (diff > 1 || av.primeraCerrada !== bo.primeraCerrada) add(5, "info", "Avalancha o Bola de nieve", `Con Avalancha pagas <b>${money(Math.max(0, diff))}</b> menos de intereses. Con Bola de nieve cierras tu primera deuda en el mes ${bo.primeraCerrada}; con Avalancha, en el mes ${av.primeraCerrada}.`, { label: "Comparar", go: "plan" });
      }
    }

    if (s.fijosTotal > 0) {
      const fondo = state.metas.find(esFondo);
      if (!fondo) add(4, "warn", "Te falta un fondo de emergencia", `Es la base de todo: un colchón para imprevistos sin endeudarte. Una buena meta es 3 meses de tus gastos fijos: <b>${money(s.fijosTotal * 3)}</b>.`, { label: "Crear esta meta", act: "crearFondo" });
      else {
        const meses = ahorradoMeta(fondo) / s.fijosTotal;
        if (meses < 1) add(4, "warn", "Tu colchón todavía es pequeño", `Cubre ${meses < 0.25 ? "menos de una semana" : `unas ${Math.round(meses * 4)} semanas`} de tus gastos fijos. Antes que otras metas, junta al menos 1 mes: ${money(s.fijosTotal)}.`);
        else if (meses >= 3) add(9, "good", "Fondo de emergencia listo", `Cubre ${fmt.format(Math.floor(meses * 10) / 10)} meses de tus gastos fijos. Ahora tu ahorro puede ir a tus otras metas.`);
      }
    }

    if (s.ingresos > 0 && s.fijosTotal / s.ingresos >= 0.6) {
      const top = [...m.presupuesto].sort((a, b) => b.monto - a.monto).slice(0, 2);
      const sumTop = top.reduce((a, x) => a + x.monto, 0);
      add(5, "warn", `Tus fijos son el ${Math.round((s.fijosTotal / s.ingresos) * 100)}% de tu ingreso`, `Lo sano es no pasar del 50–60%. Los más grandes son ${top.map((t) => `${esc(t.nombre)} (${money(t.monto)})`).join(" y ")}. Bajarlos un 10% te libera <b>${money(sumTop * 0.1)} al mes</b>.`);
    }

    if (s.ingresos > 0) {
      const tasa = s.ahorroPlan / s.ingresos;
      const meta10 = Math.ceil((s.ingresos * 0.1) / 10) * 10;
      const quedaria = s.libre - (meta10 - s.ahorroPlan);
      if (tasa < 0.1 && quedaria >= 0) add(6, "info", "Intenta ahorrar el 10%", `Tu plan de ${esc(monthName(key, false))} es ${money(s.ahorroPlan)} (${Math.round(tasa * 100)}% de lo que entra). Con ${money(meta10)} todavía te quedarían ${money(quedaria)} libres.`, { label: "Ajustar", go: "plan" });
      else if (tasa >= 0.2) add(9, "good", `Ahorras el ${Math.round(tasa * 100)}% de tu ingreso`, "Vas muy bien. Mantén el ritmo y revisa tus metas cada mes.");
    }

    const necesario = state.metas.reduce((a, meta) => a + metaInfo(meta, key).necesario, 0);
    if (necesario > s.ahorroPlan + 0.5) add(6, "warn", "Tus metas piden más de lo que ahorras", `Para llegar a tiempo necesitas ${money(necesario)} al mes y tu plan es ${money(s.ahorroPlan)}. Sube el ahorro, mueve una fecha o deja una meta para después.`, { label: "Ver metas", go: "plan" });
    const vencida = state.metas.find((meta) => metaInfo(meta, key).vencida);
    if (vencida) add(6, "info", `La fecha de "${esc(vencida.nombre)}" ya pasó`, "Ponle una fecha nueva para que la app calcule cuánto apartar al mes.", { label: "Ver metas", go: "plan" });

    const prevKey = shiftMonth(key, -1);
    const prev = state.meses[prevKey];
    if (prev) {
      const sp = summary(prev, prevKey).spentBy;
      for (const c of EXTRA_CATS) {
        const ahora = s.spentBy[c.id] || 0, antes = sp[c.id] || 0;
        if (antes > 0 && ahora > antes) add(7, "info", `Más en ${c.nombre.toLowerCase()} que el mes pasado`, `Llevas ${money(ahora)} y en todo ${esc(monthName(prevKey, false))} fueron ${money(antes)}.`);
      }
    }

    const n = streak();
    if (n >= 7) add(10, "good", `${n} días seguidos con tu cierre`, "Registrar todos los días es lo que más ayuda a ordenar la plata. Sigue así.");
    else if (isNow && n === 0 && Object.keys(state.cierres).length) add(8, "info", "Retoma tu cierre del día", "Anota hoy lo que gastaste y vuelve a empezar tu racha.", { label: "Ir a Hoy", go: "hoy" });

    if (!out.length) add(10, "good", "Todo en orden", "Tus números de este mes están sanos. Sigue registrando y revisa tu plan cada semana.");
    return out.sort((a, b) => a.p - b.p);
  }

  function consejoHtml(c) {
    const accion = c.accion ? `<button class="link" ${c.accion.go ? `data-go="${c.accion.go}"` : `data-act="${c.accion.act}"`}>${c.accion.label}</button>` : "";
    return `<div class="tip" style="--c:${NIVEL[c.nivel]}"><span class="dot"></span><div class="tip-body"><b>${c.titulo}</b><p>${c.texto}</p>${accion}</div></div>`;
  }

  /* ---------- Vista: Mi mes ---------- */
  function renderInicio() {
    const m = monthView(current);
    const s = summary(m, current);
    const mes = monthName(current, false);
    const pct = (v) => s.ingresos > 0 ? Math.max(0, (v / s.ingresos) * 100) : 0;
    const libreBar = Math.max(0, s.libre);
    const tips = consejos();

    const fijosRows = m.presupuesto.map((p) => {
      const used = s.spentBy[p.id] || 0;
      const saldo = p.monto - used;
      const done = used >= p.monto;
      const w = p.monto > 0 ? Math.min(100, (used / p.monto) * 100) : 100;
      const meta = used === 0 ? `${money(p.monto)} por pagar` : saldo > 0 ? `${money(used)} de ${money(p.monto)} · quedan ${money(saldo)}` : saldo < 0 ? `Te pasaste ${money(-saldo)}` : "Pagado completo";
      const undo = used > 0 ? `<button class="link" data-undo-fijo="${esc(p.id)}">Deshacer</button>` : "";
      return `<div class="row">
        <span class="name">${esc(p.nombre)}</span>
        <div class="side">
          <span class="amt">${money(p.monto)}</span>
          ${done ? `<span class="pill done">Listo</span>` : `<button class="pill" data-pay="${esc(p.id)}">Pagar</button>`}
        </div>
        <span class="meta">${meta} ${undo}</span>
        <div class="meter${saldo < 0 ? " over" : ""}"><i style="width:${w}%"></i></div>
      </div>`;
    }).join("");

    let deudasHtml = "";
    if (current === thisMonth()) {
      const { inicio, pagado } = deudasInicioMes();
      if (inicio.length) {
        const sim = simulate(inicio, presupuestoDeudas(inicio), state.estrategia);
        const rows = ordenEstrategia(inicio, state.estrategia).map((d) => {
          const actual = state.deudas.find((x) => x.id === d.id);
          const rec = sim.primerMes[d.id] || 0;
          const pend = Math.max(0, round2(rec - (pagado[d.id] || 0)));
          return `<div class="row">
            <span class="name">${esc(d.nombre)}</span>
            <div class="side"><span class="amt">${money(actual ? actual.saldo : 0)}</span>${pend > 0 ? `<button class="pill" data-pay-deuda="${esc(d.id)}">Pagar</button>` : `<span class="pill done">Listo</span>`}</div>
            <span class="meta">${pend > 0 ? `Este mes paga ${money(pend)}` : `Pago del mes hecho`}${pagado[d.id] ? ` · pagaste ${money(pagado[d.id])}` : ""}</span>
          </div>`;
        }).join("");
        deudasHtml = `<div class="section">
          <div class="section-head"><h2>Deudas</h2><span class="num">${money(s.deudaPagado)} de ${money(s.deudaPlan)} este mes</span></div>
          <div class="list">${rows}</div>
          <button class="link" data-go="plan">Estrategia: ${ESTRATEGIAS[state.estrategia].nombre} · libre de deudas en ${sim.nunca ? "nunca con este plan" : esc(cuando(sim.meses))}</button>
        </div>`;
      }
    }

    const plan = s.ahorroPlan;
    const now = new Date();
    const isNow = current === thisMonth();
    const needsClose = isNow && now.getHours() >= 19 && !state.cierres[todayISO()];
    const isEmpty = !state.fijos.length && !m.ingreso && !m.movs.length;

    // Cielo según la hora real y sol según el avance del mes.
    const h = now.getHours();
    const fase = h >= 5 && h < 8 ? "amanecer" : h >= 8 && h < 17 ? "dia" : h >= 17 && h < 19 ? "atardecer" : "noche";
    const saludo = h >= 5 && h < 12 ? "Buenos días" : h >= 12 && h < 19 ? "Buenas tardes" : "Buenas noches";
    const [yy, mm] = current.split("-").map(Number);
    const diasMes = new Date(yy, mm, 0).getDate();
    const restantes = isNow ? diasMes - now.getDate() + 1 : 0;
    const t = current < thisMonth() ? 1 : current > thisMonth() ? 0 : (now.getDate() - 0.5) / diasMes;
    const th = Math.PI * (1 - t);
    const sx = 180 + 160 * Math.cos(th), sy = 150 - 124 * Math.sin(th);
    const dice = solDice(s);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const stars = Array.from({ length: 30 }, () => `<circle cx="${(rnd() * 360).toFixed(1)}" cy="${(rnd() * 170).toFixed(1)}" r="${(0.5 + rnd() * 1.2).toFixed(2)}"/>`).join("");
    const mesCorto = new Date(yy, mm - 1, 1).toLocaleDateString("es-PE", { month: "short" }).replace(".", "");

    document.getElementById("view-inicio").innerHTML = `
      ${isEmpty ? `<div class="empty"><b>Empieza por tu ingreso y tus gastos fijos</b>Ponlos en Ajustes. Con eso la app calcula cuánto te queda libre cada mes.<br><br><button class="btn" data-go="ajustes">Ir a Ajustes</button></div>` : ""}
      ${state.nombre === undefined && !isEmpty ? `<div class="card ask"><h3>¿Cómo te llamo?</h3><p>Así el sol te saluda por tu nombre.</p><form id="askName"><input class="input" id="askNameInput" maxlength="20" placeholder="Tu nombre" autocomplete="given-name" /><button class="btn accent" type="submit">Listo</button></form><button class="link" data-act="noName">Ahora no</button></div>` : ""}
      <section class="sky ${fase}" aria-label="Resumen de ${esc(mes)}">
        <svg class="sky-stars" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${stars}</svg>
        <div class="sky-head">
          <p class="greet">${saludo}${state.nombre ? `, ${esc(state.nombre)}` : ""}</p>
          <p class="say">${esc(dice.text)}</p>
          ${needsClose ? `<button class="sky-cta" data-go="hoy">${icon("llama")} Cerrar el día</button>` : ""}
        </div>
        <div class="arc">
          <svg viewBox="0 0 360 172" preserveAspectRatio="none" aria-hidden="true">
            <path d="M20 150A160 124 0 0 1 340 150" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
            ${t > 0.005 ? `<path d="M20 150A160 124 0 0 1 ${sx.toFixed(1)} ${sy.toFixed(1)}" fill="none" stroke="#ffd060" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>` : ""}
          </svg>
          <div class="sun-pos" style="left:${((sx / 360) * 100).toFixed(2)}%;top:${((sy / 172) * 100).toFixed(2)}%">${mascotSVG(dice.mood)}</div>
          <span class="arc-end l">1 ${esc(mesCorto)}</span>
          <span class="arc-end r">${diasMes} ${esc(mesCorto)}</span>
          <div class="arc-center">
            <p class="eyebrow">Libre para gastar</p>
            <p class="big${s.libre < 0 ? " neg" : ""}"><small>S/</small><span id="libreNum">${s.libre < 0 ? "−" : ""}${fmt.format(Math.abs(s.libre))}</span></p>
          </div>
        </div>
        <div class="sky-foot">
          <svg viewBox="0 0 360 74" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 74V40l30-14 22 10 32-22 28 18 28-10 30 16 34-28 32 22 26-8 30 12 30-18 38 16v40z" fill="var(--ridge-back)"/>
            <path d="M78 18.1 84 14l6 3.9-3 1.4-3-2-3 2zM198 14.9 204 10l6 4.1-3 1.4-3-2-3 2zM316 21.6 322 18l6 2.5-3 1.5-3-2-3 2z" fill="#fff" fill-opacity="0.85"/>
            <path d="M0 74V54l40-12 30 10 34-16 36 14 38-10 36 14 38-16 38 14 36-8 34 8v26z" fill="var(--ridge-front)"/>
          </svg>
          <p><span>${isNow && s.libre > 0 ? `${money(s.libre / restantes)} al día` : isNow ? "Sin margen este mes" : current < thisMonth() ? "Mes terminado" : "Mes por venir"}</span><span>${isNow ? `quedan ${restantes} ${restantes === 1 ? "día" : "días"}` : esc(monthName(current))}</span></p>
        </div>
        <div class="ribbon"></div>
      </section>

      <div class="split">
        <p class="sub">Entraron <b class="num">${money(s.ingresos)}</b> · fijos <b class="num">${money(s.fijosTotal)}</b>${s.deudaComp ? ` · deudas <b class="num">${money(s.deudaComp)}</b>` : ""}${s.ahorroComp ? ` · ahorro <b class="num">${money(s.ahorroComp)}</b>` : ""}</p>
        <div class="stack" role="img" aria-label="Reparto del ingreso del mes">
          <i style="width:${pct(s.fijosPagado + s.deudaPagado)}%;background:var(--bar-paid)"></i>
          <i style="width:${pct(s.fijosPendiente + s.excesoFijos + s.deudaComp - s.deudaPagado)}%;background:var(--bar-pending)"></i>
          <i style="width:${pct(s.extra)}%;background:var(--bar-extra)"></i>
          <i style="width:${pct(s.ahorroComp)}%;background:var(--t2)"></i>
          <i style="width:${pct(libreBar)}%;background:var(--good)"></i>
        </div>
        <div class="legend">
          <span style="--c:var(--bar-paid)">Pagado</span>
          <span style="--c:var(--bar-pending)">Por pagar</span>
          <span style="--c:var(--bar-extra)">Otros</span>
          <span style="--c:var(--t2)">Ahorro</span>
          <span style="--c:var(--good)">Libre</span>
        </div>
      </div>

      ${isEmpty ? "" : `<div class="tips">${tips.slice(0, 2).map(consejoHtml).join("")}${tips.length > 2 ? `<button class="link" data-go="plan">Ver los ${tips.length} consejos de tu asesor</button>` : ""}</div>`}

      <div class="section">
        <div class="section-head"><h2>Gastos fijos</h2><span class="num">${money(s.fijosPagado)} de ${money(s.fijosTotal)} pagado</span></div>
        <div class="list">${fijosRows || `<div class="row"><span class="meta">Agrega tus gastos fijos en Ajustes.</span></div>`}</div>
      </div>

      ${deudasHtml}

      <div class="goal">
        <div class="line"><h2>Ahorro de ${esc(mes)}</h2><b>${money(s.ahorro)}</b></div>
        <div class="meter"><i style="width:${plan > 0 ? Math.min(100, (s.ahorro / plan) * 100) : 0}%"></i></div>
        <p>${plan > 0 ? (s.ahorro >= plan ? `Cumpliste tu plan de ${money(plan)}.` : `Tu plan: ${money(plan)}. Faltan ${money(plan - s.ahorro)}.`) : "Todavía no tienes un plan de ahorro para este mes."} En total llevas ${money(totalAhorrado())} ahorrados.</p>
        <div class="btns">
          ${plan > s.ahorro ? `<button class="btn accent" data-save="1">Apartar ${money(plan - s.ahorro)}</button>` : ""}
          <button class="btn ghost" data-go="plan">Metas y plan</button>
        </div>
      </div>`;
    countUp(document.getElementById("libreNum"), s.libre);
  }

  /* ---------- Vista: Hoy (cierre del día) ---------- */
  function addDays(iso, delta) {
    const [y, mo, d] = iso.split("-").map(Number);
    const x = new Date(y, mo - 1, d + delta);
    return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
  }

  function streak() {
    const today = todayISO();
    let day = state.cierres[today] ? today : addDays(today, -1);
    let n = 0;
    while (state.cierres[day]) { n++; day = addDays(day, -1); }
    return n;
  }

  function renderHoy() {
    const today = todayISO();
    const m = monthView(monthKeyOf(today));
    const movs = m.movs.filter((x) => x.fecha === today).sort((a, b) => b.id.localeCompare(a.id));
    const gastos = movs.filter((x) => x.tipo === "gasto").reduce((a, x) => a + x.monto, 0);
    const closed = !!state.cierres[today];
    const n = streak();
    const [y, mo, d] = today.split("-").map(Number);
    const fecha = new Date(y, mo - 1, d).toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });

    const week = [];
    for (let i = 6; i >= 0; i--) {
      const iso = addDays(today, -i);
      const [yy, mm, dd] = iso.split("-").map(Number);
      const label = new Date(yy, mm - 1, dd).toLocaleDateString("es-PE", { weekday: "short" }).replace(".", "").slice(0, 2);
      const c = state.cierres[iso];
      week.push(`<div class="${c === true ? "on" : c ? "prot" : ""}${iso === today ? " today" : ""}"><i>${c === true ? icon("llama") : c ? icon("escudo") : ""}</i>${esc(label)}</div>`);
    }

    const cats = [...m.presupuesto, ...EXTRA_CATS];
    const rows = movs.map((mv) => {
      const cls = mv.tipo === "ingreso" ? " in" : mv.tipo === "ahorro" ? " save" : "";
      const sign = mv.tipo === "gasto" || mv.tipo === "deuda" ? "−" : "+";
      return `<div class="row"><span class="name">${esc(movLabel(m, mv))}</span><div class="side"><span class="amt${cls}">${sign} ${money(mv.monto)}</span></div><span class="meta">${mv.nota ? esc(mv.nota) : ""}</span></div>`;
    }).join("");

    const prot = state.protectores || 0;
    const ganado = xpHoy();
    document.getElementById("view-hoy").innerHTML = `
      <div class="fire${n ? "" : " off"}">
        ${ganado ? `<span class="xp-today">+${ganado} de brillo hoy</span>` : ""}
        <div class="fire-art">${flameBig(n > 0)}<b class="num">${n}</b></div>
        <h2>${n === 1 ? "día seguido" : "días seguidos"}</h2>
        <p>${closed ? "¡Hoy ya cerraste! Vuelve mañana para seguir sumando." : n ? "Cierra hoy para no perder tu racha." : "Cierra tu primer día y enciende la llama."}</p>
        <span class="shields">${icon("escudo")} ${prot} ${prot === 1 ? "protector" : "protectores"} de racha</span>
        <div class="ribbon"></div>
      </div>
      <div class="week" aria-label="Últimos 7 días">${week.join("")}</div>

      <div class="section">
        <div class="section-head"><h2>¿Qué gastaste hoy?</h2><span class="num">${money(gastos)} · ${esc(fecha)}</span></div>
        <div class="chips">${cats.map((c) => `<button class="chip" data-quick="${esc(c.id)}">${esc(c.nombre)}</button>`).join("")}</div>
        ${movs.length ? `<div class="list">${rows}</div>` : `<div class="empty">Toca una categoría para anotar un gasto de hoy. Piensa en lo que pagaste en efectivo, Yape o tarjeta.</div>`}
      </div>

      ${closed
        ? `<div class="closed"><span>Día cerrado. Buen trabajo.</span><button class="pill" data-reopen="1">Reabrir</button></div>`
        : `<button class="btn accent block" data-close="1">${movs.length ? "Listo, cerrar el día" : "Hoy no gasté nada"}</button>`}`;
  }

  /* ---------- Vista: Plan ---------- */
  function renderPlan() {
    const key = current;
    const m = monthView(key);
    const s = summary(m, key);
    const mes = monthName(key, false);
    const tips = consejos();
    const sug = sugeridoAhorro(key);
    const tasa = s.ingresos > 0 ? Math.round((s.ahorroPlan / s.ingresos) * 100) : 0;

    const metasHtml = state.metas.map((meta, idx) => {
      const info = metaInfo(meta, key);
      const w = meta.objetivo > 0 ? Math.min(100, (info.ahorrado / meta.objetivo) * 100) : 0;
      let detalle;
      if (info.faltan <= 0) detalle = "¡Meta cumplida!";
      else if (info.vencida) detalle = `La fecha ya pasó y faltan ${money(info.faltan)}. Ponle una fecha nueva.`;
      else if (meta.fecha) detalle = `Para ${esc(monthName(meta.fecha))}: aparta <b>${money(info.necesario)} al mes</b> durante ${info.mesesRest} ${info.mesesRest === 1 ? "mes" : "meses"}.`;
      else if (s.ahorroPlan > 0) { const n = Math.ceil(info.faltan / s.ahorroPlan); detalle = `Sin fecha. Faltan ${money(info.faltan)}: con todo tu ahorro del mes (${money(s.ahorroPlan)}) llegas en ${n} ${n === 1 ? "mes" : "meses"}, en ${esc(monthName(shiftMonth(key, n - 1)))}.`; }
      else detalle = `Sin fecha. Faltan ${money(info.faltan)}.`;
      return `<div class="item meta-item${info.faltan <= 0 ? " done" : ""}" style="--c:var(--t${((idx + 1) % 6) + 1});--v:${w.toFixed(1)}">
        <div class="ring"><span>${Math.floor(w)}%</span></div>
        <div class="meta-body">
          <div class="item-head"><b>${esc(meta.nombre)}</b><span class="amt">${money(info.ahorrado)} / ${money(meta.objetivo)}</span></div>
          <p class="meta">${detalle}</p>
          <div class="btns">${info.faltan > 0 ? `<button class="pill" data-meta-save="${esc(meta.id)}">Apartar</button>` : ""}<button class="pill" data-edit-meta="${esc(meta.id)}">Editar</button></div>
        </div>
      </div>`;
    }).join("");

    const { inicio, pagado } = deudasInicioMes();
    let deudasHtml = "";
    const deudasList = state.deudas.map((d) => {
      const paid = d.saldo <= 0.005;
      return `<div class="item${paid ? " done" : ""}">
        <div class="item-head"><b>${esc(d.nombre)}</b><span class="amt">${paid ? "Pagada" : money(d.saldo)}</span></div>
        <p class="meta">TEA ${fmt.format(d.tea || 0)}% · cuota mínima ${money(d.minimo || 0)}</p>
        <div class="btns">${paid ? "" : `<button class="pill" data-pay-deuda="${esc(d.id)}">Pagar</button>`}<button class="pill" data-edit-deuda="${esc(d.id)}">Editar</button></div>
      </div>`;
    }).join("");

    if (inicio.length) {
      const sumMin = sumMinimos(inicio);
      const pres = presupuestoDeudas(inicio);
      const sims = Object.fromEntries(Object.keys(ESTRATEGIAS).map((k) => [k, simulate(inicio, pres, k)]));
      const elegida = sims[state.estrategia];
      const cards = Object.entries(ESTRATEGIAS).map(([k, e]) => {
        const r = sims[k];
        return `<button class="strategy" data-estrategia="${k}" aria-pressed="${state.estrategia === k}">
          <b>${e.nombre}${k === "avalancha" ? `<span class="badge">Menos intereses</span>` : ""}</b>
          <span>${e.corto}</span>
          <span class="stats">${r.nunca ? "No terminas nunca: la cuota no cubre los intereses" : `<span>Libre en ${esc(cuando(r.meses))}</span><span>Intereses ${money(r.intereses)}</span>`}</span>
        </button>`;
      }).join("");
      const planRows = ordenEstrategia(inicio, state.estrategia).map((d, i) => {
        const rec = elegida.primerMes[d.id] || 0;
        const pend = Math.max(0, round2(rec - (pagado[d.id] || 0)));
        const extra = Math.max(0, rec - minDe(d));
        return `<div class="row">
          <span class="name">${i + 1}. ${esc(d.nombre)}${extra > 0.5 ? `<span class="badge">Foco</span>` : ""}</span>
          <div class="side"><span class="amt">${money(rec)}</span></div>
          <span class="meta">${extra > 0.5 ? `Mínimo ${money(minDe(d))} + extra ${money(extra)}` : "Solo el mínimo"}${elegida.payoff[d.id] ? ` · la terminas en ${esc(monthName(shiftMonth(thisMonth(), elegida.payoff[d.id] - 1)))}` : ""}${pend <= 0 ? " · ya pagado" : ""}</span>
        </div>`;
      }).join("");
      deudasHtml = `
        <div class="card">
          <div class="field"><label for="deudaPresupuesto">Cada mes puedo poner para deudas</label><div class="money"><input class="input" id="deudaPresupuesto" inputmode="decimal" placeholder="${round2(sumMin)}" value="${numVal(state.deudaPresupuesto)}" /></div></div>
          <p>Las cuotas mínimas suman ${money(sumMin)}. Todo lo que pongas encima acelera el pago y te ahorra intereses.</p>
        </div>
        <div class="section">
          <div class="section-head"><h2>¿Cómo las atacas?</h2></div>
          <div class="strategies">${cards}</div>
          <p class="hint" style="margin:0">${ESTRATEGIAS[state.estrategia].texto}</p>
        </div>
        <div class="section">
          <div class="section-head"><h2>Qué pagar en ${esc(monthName(thisMonth(), false))}</h2><span class="num">${money(pres)}</span></div>
          <div class="list">${planRows}</div>
        </div>`;
    }

    document.getElementById("view-plan").innerHTML = `
      <div class="hero">
        <p class="eyebrow">Tu plan · ${esc(monthName(key))}</p>
        <h2 class="plan-title">Qué hacer con tu plata este mes</h2>
      </div>

      <div class="section">
        <div class="section-head"><h2>Tu asesor</h2><span>${tips.length} ${tips.length === 1 ? "consejo" : "consejos"}</span></div>
        <div class="tips">${tips.map(consejoHtml).join("")}</div>
      </div>

      <div class="card">
        <h3>Ahorro de ${esc(mes)}</h3>
        <div class="two">
          <div class="field"><label for="planAhorroMes">Este mes voy a ahorrar</label><div class="money"><input class="input" id="planAhorroMes" inputmode="decimal" placeholder="0" value="${numVal(s.ahorroPlan)}" /></div></div>
          <div class="field"><label for="ahorroDefault">Por defecto cada mes</label><div class="money"><input class="input" id="ahorroDefault" inputmode="decimal" placeholder="0" value="${numVal(state.ahorroMensual)}" /></div></div>
        </div>
        <p>${s.ingresos > 0 ? `Es el ${tasa}% de lo que entra. ` : ""}${sug > 0 && sug !== s.ahorroPlan ? `Te sugiero <b>${money(sug)}</b>${state.metas.some((x) => x.fecha) ? " para llegar a tus metas a tiempo" : " (10% de tu ingreso)"}.` : ""} Si cambias solo este mes, los demás meses siguen con el monto por defecto.</p>
        ${sug > 0 && sug !== s.ahorroPlan ? `<button class="btn ghost" data-act="usarSugerido">Usar ${money(sug)} este mes</button>` : ""}
      </div>

      <div class="section">
        <div class="section-head"><h2>Metas a largo plazo</h2><span class="num">${money(totalAhorrado())} ahorrados</span></div>
        ${metasHtml ? `<div class="items">${metasHtml}</div>` : `<div class="empty"><b>Aún no tienes metas</b>Crea una con nombre, monto y fecha (un viaje, una laptop, tu fondo de emergencia) y la app te dice cuánto apartar cada mes.</div>`}
        <button class="btn ghost" data-new-meta="1">Nueva meta</button>
      </div>

      <div class="section">
        <div class="section-head"><h2>Deudas</h2>${inicio.length ? `<span class="num">Debes ${money(state.deudas.reduce((a, d) => a + d.saldo, 0))}</span>` : ""}</div>
        ${deudasList ? `<div class="items">${deudasList}</div>` : `<div class="empty"><b>Sin deudas registradas</b>Si tienes tarjetas o préstamos, agrégalos con su saldo, su TEA y la cuota mínima. La app te arma un plan para salir de ellos.</div>`}
        <button class="btn ghost" data-new-deuda="1">Agregar deuda</button>
      </div>
      ${deudasHtml}`;
  }

  /* ---------- Vista: Historial ---------- */
  function renderMovimientos() {
    const m = monthView(current);
    const s = summary(m, current);
    const movs = [...m.movs].sort((a, b) => (b.fecha + b.id).localeCompare(a.fecha + a.id));
    const el = document.getElementById("view-movimientos");

    const cats = Object.entries(s.spentBy).sort((a, b) => b[1] - a[1]);
    const maxCat = cats.length ? cats[0][1] : 0;
    const catHtml = cats.map(([id, v]) => `<div class="cat"><span>${esc(catName(m, id))}</span><div class="meter"><i style="width:${(v / maxCat) * 100}%"></i></div><span class="amt">${money(v)}</span></div>`).join("");

    let html = `<div class="hero">
      <p class="eyebrow">Gastado en ${esc(monthName(current, false))}</p>
      <p class="big"><small>S/</small>${fmt.format(s.gastado)}</p>
      <p class="sub">${m.movs.length} ${m.movs.length === 1 ? "movimiento" : "movimientos"} · ingresos extra <b class="num">${money(s.ingresosExtra)}</b> · ahorro <b class="num">${money(s.ahorro)}</b>${s.deudaPagado ? ` · deudas <b class="num">${money(s.deudaPagado)}</b>` : ""}</p>
    </div>`;

    if (cats.length) html += `<div class="section"><div class="section-head"><h2>¿En qué se fue?</h2></div><div class="card cats">${catHtml}</div></div>`;

    if (!movs.length) {
      html += `<div class="empty"><b>Aún no hay movimientos este mes</b>Toca el botón + para registrar un gasto, un ingreso o un ahorro. Toma menos de 5 segundos.</div>`;
    } else {
      let lastDay = "";
      html += `<div class="section">`;
      let open = false;
      for (const mv of movs) {
        if (mv.fecha !== lastDay) {
          if (open) html += `</div>`;
          const [y, mo, d] = mv.fecha.split("-").map(Number);
          html += `<p class="day">${esc(new Date(y, mo - 1, d).toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "short" }))}</p><div class="list">`;
          open = true; lastDay = mv.fecha;
        }
        const cls = mv.tipo === "ingreso" ? " in" : mv.tipo === "ahorro" ? " save" : "";
        const sign = mv.tipo === "gasto" || mv.tipo === "deuda" ? "−" : "+";
        html += `<div class="row">
          <span class="name">${esc(movLabel(m, mv))}</span>
          <div class="side"><span class="amt${cls}">${sign} ${money(mv.monto)}</span><button class="pill danger" data-del="${esc(mv.id)}">Borrar</button></div>
          <span class="meta">${mv.nota ? esc(mv.nota) : ""}</span>
        </div>`;
      }
      if (open) html += `</div>`;
      html += `</div>`;
    }
    el.innerHTML = html;
  }

  /* ---------- Vista: Ajustes ---------- */
  function renderAjustes() {
    const m = monthView(current);
    const fijosHtml = state.fijos.map((f) => `
      <div class="fixed-row">
        <input class="input" id="fn-${esc(f.id)}" data-fname="${esc(f.id)}" value="${esc(f.nombre)}" aria-label="Nombre del gasto fijo" />
        <div class="money"><input class="input" id="fm-${esc(f.id)}" data-fmonto="${esc(f.id)}" inputmode="decimal" placeholder="0" value="${numVal(f.monto)}" aria-label="Monto de ${esc(f.nombre)}" /></div>
        <button class="icon-btn" data-fdel="${esc(f.id)}" aria-label="Quitar ${esc(f.nombre)}">×</button>
      </div>`).join("");
    const totalFijos = state.fijos.reduce((a, f) => a + f.monto, 0);

    document.getElementById("view-ajustes").innerHTML = `
      <div class="hero"><p class="eyebrow">Ajustes</p><p class="sub">Los cambios aplican a <b>${esc(monthName(current))}</b> y a los meses que vienen. Los meses pasados no se tocan.</p></div>

      <div class="card">
        <h3>Tú</h3>
        <div class="field"><label for="nombreInput">¿Cómo te llamo?</label><input class="input" id="nombreInput" maxlength="20" placeholder="Tu nombre" value="${esc(state.nombre || "")}" /></div>
        <label class="switch" for="sonidoInput"><span>Sonidos y vibración</span><input type="checkbox" id="sonidoInput" ${state.sonido ? "checked" : ""} /></label>
      </div>

      <div class="card">
        <h3>Ingreso del mes</h3>
        <div class="field"><label for="ingresoMes">Lo que entra en ${esc(monthName(current, false))}</label><div class="money"><input class="input" id="ingresoMes" inputmode="decimal" placeholder="0" value="${numVal(m.ingreso)}" /></div></div>
        <p>Si te entra algo extra (un cachuelo, un bono), regístralo con + como Ingreso.</p>
      </div>

      <div class="card">
        <h3>Gastos fijos · <span class="num">${money(totalFijos)}</span></h3>
        <div class="cats">${fijosHtml}</div>
        <button class="btn ghost" id="addFijo">Agregar gasto fijo</button>
      </div>

      <div class="card">
        <h3>Respaldo</h3>
        <p>Tus datos se guardan solo en este celular. Copia un respaldo de vez en cuando y guárdalo en tus notas o en Drive.</p>
        <div class="btns">
          <button class="btn ghost" id="copyBackup">Copiar respaldo</button>
          <button class="btn ghost" id="downloadCsv">Descargar CSV</button>
        </div>
        <div class="field"><label for="restoreText">Restaurar desde un respaldo</label><textarea class="input" id="restoreText" placeholder="Pega aquí el texto del respaldo"></textarea></div>
        <div class="btns">
          <button class="btn ghost" id="restoreBtn">Restaurar</button>
          <button class="pill danger" id="resetBtn">Borrar todo</button>
        </div>
      </div>`;
  }

  function render() {
    document.getElementById("monthLabel").textContent = monthName(current);
    for (const sec of document.querySelectorAll("[data-view]")) sec.hidden = sec.dataset.view !== view;
    for (const b of document.querySelectorAll("[data-tab]")) { if (b.dataset.tab === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }
    document.getElementById("fab").hidden = view === "ajustes" || view === "hoy" || view === "plan";
    if (view === "inicio") renderInicio();
    else if (view === "hoy") renderHoy();
    else if (view === "plan") renderPlan();
    else if (view === "movimientos") renderMovimientos();
    else renderAjustes();
    renderTop();
    clearTimeout(celebTimer);
    celebTimer = setTimeout(checkCelebrations, 900);
  }

  function goView(v) {
    view = v;
    if (view === "hoy") current = thisMonth();
    render();
    const sec = document.getElementById("view-" + v);
    sec.classList.remove("entering");
    void sec.offsetWidth;
    sec.classList.add("entering");
    window.scrollTo(0, 0);
  }

  /* ---------- Movimientos: agregar y deshacer ---------- */
  let toastTimer, toastUndoId = null;
  function toast(msg, undoId) {
    const t = document.getElementById("toast");
    toastUndoId = undoId || null;
    t.innerHTML = `<span>${esc(msg)}</span>${undoId ? `<button type="button" id="toastUndo">Deshacer</button>` : ""}`;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; toastUndoId = null; }, undoId ? 5000 : 2200);
  }
  document.getElementById("toast").addEventListener("click", (e) => {
    if (!e.target.closest("#toastUndo") || !toastUndoId) return;
    removeMov(toastUndoId);
    render();
    toast("Listo, se deshizo");
  });

  function addMov(mv) {
    const key = monthKeyOf(mv.fecha);
    const item = { id: uid(), ...mv };
    if (mv.tipo === "deuda") {
      const d = state.deudas.find((x) => x.id === mv.deuda);
      if (d) { const antes = d.saldo; d.saldo = round2(Math.max(0, d.saldo - mv.monto)); item.aplicado = round2(antes - d.saldo); }
    }
    getMonth(key, true).movs.push(item);
    save();
    return item.id;
  }

  function removeMov(id) {
    for (const m of Object.values(state.meses)) {
      const mv = m.movs.find((x) => x.id === id);
      if (!mv) continue;
      if (mv.tipo === "deuda") {
        const d = state.deudas.find((x) => x.id === mv.deuda);
        if (d) d.saldo = round2(d.saldo + (mv.aplicado != null ? mv.aplicado : mv.monto));
      }
      m.movs = m.movs.filter((x) => x.id !== id);
      save();
      return true;
    }
    return false;
  }

  function defaultDate() {
    const t = todayISO();
    return monthKeyOf(t) === current ? t : `${current}-01`;
  }

  /* ---------- Hoja de registro ---------- */
  const sheet = document.getElementById("sheet");
  let sheetTipo = "gasto", sheetSel = null;

  function sheetOptions(t) {
    if (t === "gasto") { const m = monthView(current); return [...m.presupuesto, ...EXTRA_CATS]; }
    if (t === "ahorro") return state.metas;
    if (t === "deuda") return state.deudas.filter((d) => d.saldo > 0.005);
    return [];
  }

  function renderSheetCats() {
    const list = sheetOptions(sheetTipo);
    if (!list.some((c) => c.id === sheetSel)) sheetSel = sheetTipo === "gasto" && list.some((c) => c.id === "gustos") ? "gustos" : (list[0] ? list[0].id : null);
    document.getElementById("catField").hidden = !list.length;
    document.getElementById("catLabel").textContent = sheetTipo === "ahorro" ? "¿Para qué meta?" : sheetTipo === "deuda" ? "¿Qué deuda?" : "¿En qué?";
    document.getElementById("movCats").innerHTML = list.map((c) => `<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id === sheetSel}">${esc(c.nombre)}</button>`).join("");
  }

  function setTipo(t, titulo) {
    sheetTipo = t;
    for (const b of document.querySelectorAll("[data-tipo]")) b.setAttribute("aria-pressed", String(b.dataset.tipo === t));
    document.getElementById("sheetTitle").textContent = titulo || (t === "gasto" ? "Nuevo gasto" : t === "ingreso" ? "Nuevo ingreso" : t === "ahorro" ? "Apartar ahorro" : "Pagar deuda");
    renderSheetCats();
  }

  function openSheet(opts = {}) {
    document.querySelector('[data-tipo="deuda"]').hidden = !state.deudas.some((d) => d.saldo > 0.005);
    sheetSel = opts.sel || null;
    setTipo(opts.tipo || "gasto", opts.titulo);
    document.getElementById("movMonto").value = opts.monto ? String(round2(opts.monto)) : "";
    document.getElementById("movNota").value = opts.nota || "";
    document.getElementById("movFecha").value = opts.fecha || defaultDate();
    document.getElementById("movError").hidden = true;
    const hint = document.getElementById("movHint");
    hint.hidden = !opts.hint; hint.innerHTML = opts.hint || "";
    const quick = document.getElementById("movQuick");
    quick.hidden = !(opts.quick && opts.quick.length);
    quick.innerHTML = (opts.quick || []).map((q) => `<button type="button" class="chip" data-amount="${q.monto}">${esc(q.label)}</button>`).join("");
    if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", "");
    // El monto queda enfocado y seleccionado: lo que escribas reemplaza el número sugerido.
    const amount = document.getElementById("movMonto");
    amount.focus();
    amount.select();
  }
  function closeSheet() { if (sheet.open) sheet.close ? sheet.close() : sheet.removeAttribute("open"); }

  function payFijo(id) {
    const m = monthView(current);
    const p = m.presupuesto.find((x) => x.id === id);
    if (!p) return;
    const rest = round2(p.monto - (summary(m, current).spentBy[p.id] || 0));
    if (rest <= 0) return;
    openSheet({
      tipo: "gasto", sel: p.id, monto: rest, nota: "Pago del mes", titulo: `Pagar ${p.nombre}`,
      hint: `Faltan ${money(rest)}. Si vas a pagar solo una parte, cambia el monto.`,
      quick: [{ label: `Todo ${money(rest)}`, monto: rest }, { label: `Mitad ${money(rest / 2)}`, monto: round2(rest / 2) }]
    });
  }

  function payDeuda(id) {
    const d = state.deudas.find((x) => x.id === id);
    if (!d) return;
    const { inicio, pagado } = deudasInicioMes();
    const sim = simulate(inicio, presupuestoDeudas(inicio), state.estrategia);
    const pend = Math.max(0, round2((sim.primerMes[id] || 0) - (pagado[id] || 0)));
    const quick = [];
    if (pend > 0) quick.push({ label: `Lo del plan ${money(pend)}`, monto: pend });
    if (minDe(d) > 0 && Math.abs(minDe(d) - pend) > 0.5) quick.push({ label: `Mínimo ${money(minDe(d))}`, monto: minDe(d) });
    quick.push({ label: `Todo ${money(d.saldo)}`, monto: d.saldo });
    openSheet({
      tipo: "deuda", sel: id, monto: pend || minDe(d), titulo: `Pagar ${d.nombre}`, fecha: todayISO(),
      hint: `Debes ${money(d.saldo)}.${pend > 0 ? ` Según tu plan, este mes toca ${money(pend)}.` : ""} Puedes pagar más o menos.`,
      quick
    });
  }

  function saveToMeta(id) {
    const meta = state.metas.find((x) => x.id === id);
    if (!meta) return;
    const info = metaInfo(meta, current);
    const s = summary(monthView(current), current);
    const monto = info.necesario > 0 ? Math.ceil(info.necesario) : Math.max(0, s.ahorroPlan - s.ahorro) || "";
    openSheet({ tipo: "ahorro", sel: id, monto, titulo: `Apartar para ${meta.nombre}` });
  }

  document.getElementById("fab").addEventListener("click", () => openSheet());
  document.getElementById("closeSheet").addEventListener("click", closeSheet);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
  document.querySelector(".seg").addEventListener("click", (e) => { const b = e.target.closest("[data-tipo]"); if (b) { sheetSel = null; setTipo(b.dataset.tipo); } });
  document.getElementById("movCats").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    sheetSel = b.dataset.cat;
    for (const c of document.querySelectorAll("#movCats [data-cat]")) c.setAttribute("aria-pressed", String(c.dataset.cat === sheetSel));
  });
  document.getElementById("movQuick").addEventListener("click", (e) => {
    const b = e.target.closest("[data-amount]"); if (!b) return;
    document.getElementById("movMonto").value = b.dataset.amount;
  });
  document.getElementById("movForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const monto = round2(parseAmount(document.getElementById("movMonto").value));
    if (!(monto > 0)) { document.getElementById("movError").hidden = false; return; }
    const fecha = document.getElementById("movFecha").value || defaultDate();
    const nota = document.getElementById("movNota").value.trim();
    const mv = { tipo: sheetTipo, monto, nota, fecha };
    if (sheetTipo === "gasto") mv.cat = sheetSel || "otros";
    if (sheetTipo === "ahorro") mv.meta = sheetSel;
    if (sheetTipo === "deuda") { if (!sheetSel) return; mv.deuda = sheetSel; }
    const id = addMov(mv);
    const fab = document.getElementById("fab").getBoundingClientRect();
    closeSheet();
    if (sheetTipo === "ahorro") { sonar("moneda"); vibrar(20); confeti({ monedas: true, n: 45, x: fab.left + fab.width / 2, y: fab.top }); }
    else if (sheetTipo === "deuda" || sheetTipo === "ingreso") { sonar("moneda"); vibrar(20); }
    else sonar("tick");
    if (view !== "hoy" && view !== "plan") current = monthKeyOf(fecha);
    render();
    toast(sheetTipo === "gasto" ? `Gasto de ${money(monto)} guardado` : sheetTipo === "ingreso" ? `Ingreso de ${money(monto)} guardado` : sheetTipo === "ahorro" ? `Apartaste ${money(monto)}` : `Pagaste ${money(monto)}`, id);
  });

  // Al tocar un campo de monto se selecciona todo, así lo que escribes reemplaza el número.
  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (t.matches && t.matches('input[inputmode="decimal"]')) setTimeout(() => { try { t.setSelectionRange(0, t.value.length); } catch (err) { /* sin selección */ } }, 0);
  });

  /* ---------- Editor de metas y deudas ---------- */
  const editor = document.getElementById("editor");
  let edKind = null, edId = null;

  const moneyField = (id, label, val, extra = "") => `<div class="field"><label for="${id}">${label}</label><div class="money"><input class="input" id="${id}" inputmode="decimal" placeholder="0" value="${numVal(val)}" /></div>${extra}</div>`;

  function openEditor(kind, id) {
    edKind = kind; edId = id || null;
    let html = "";
    if (kind === "meta") {
      const x = state.metas.find((v) => v.id === id) || { nombre: "", objetivo: 0, fecha: "", base: 0 };
      document.getElementById("edTitle").textContent = id ? "Editar meta" : "Nueva meta";
      html = `<div class="field"><label for="edNombre">Nombre</label><input class="input" id="edNombre" maxlength="40" placeholder="Ej.: Viaje a Cusco" value="${esc(x.nombre)}" /></div>
        ${moneyField("edObjetivo", "¿Cuánto necesitas?", x.objetivo)}
        <div class="field"><label for="edFecha">¿Para cuándo? (opcional)</label><input class="input" id="edFecha" type="month" min="${thisMonth()}" value="${esc(x.fecha || "")}" /></div>
        ${moneyField("edBase", "Ya tengo ahorrado para esto (opcional)", x.base)}`;
    } else {
      const x = state.deudas.find((v) => v.id === id) || { nombre: "", saldo: 0, tea: 0, minimo: 0 };
      document.getElementById("edTitle").textContent = id ? "Editar deuda" : "Nueva deuda";
      html = `<div class="field"><label for="edNombre">Nombre</label><input class="input" id="edNombre" maxlength="40" placeholder="Ej.: Tarjeta Visa" value="${esc(x.nombre)}" /></div>
        ${moneyField("edSaldo", "¿Cuánto debes hoy?", x.saldo)}
        <div class="field"><label for="edTea">Interés anual (TEA)</label><div class="pct"><input class="input" id="edTea" inputmode="decimal" placeholder="0" value="${numVal(x.tea)}" /></div><p class="hint" style="margin:0">Sale en tu estado de cuenta. Referencia: tarjetas 40–100%, préstamos personales 15–40%. Si es un préstamo sin interés, deja 0.</p></div>
        ${moneyField("edMinimo", "Cuota mínima al mes", x.minimo)}`;
    }
    document.getElementById("edFields").innerHTML = html;
    document.getElementById("edError").hidden = true;
    const del = document.getElementById("edDelete");
    del.hidden = !id; del.classList.remove("arm"); del.textContent = "Eliminar";
    if (typeof editor.showModal === "function") editor.showModal(); else editor.setAttribute("open", "");
  }
  function closeEditor() { if (editor.open) editor.close ? editor.close() : editor.removeAttribute("open"); }

  document.getElementById("edClose").addEventListener("click", closeEditor);
  editor.addEventListener("click", (e) => { if (e.target === editor) closeEditor(); });
  document.getElementById("edForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const err = (msg) => { const el = document.getElementById("edError"); el.textContent = msg; el.hidden = false; };
    const nombre = document.getElementById("edNombre").value.trim();
    if (!nombre) return err("Ponle un nombre.");
    if (edKind === "meta") {
      const objetivo = round2(parseAmount(document.getElementById("edObjetivo").value));
      if (!(objetivo > 0)) return err("Escribe cuánto necesitas.");
      const data = { nombre, objetivo, fecha: document.getElementById("edFecha").value || "", base: round2(parseAmount(document.getElementById("edBase").value)) };
      if (edId) Object.assign(state.metas.find((v) => v.id === edId), data); else state.metas.push({ id: "m" + uid(), ...data });
    } else {
      const saldo = round2(parseAmount(document.getElementById("edSaldo").value));
      if (!(saldo > 0)) return err("Escribe cuánto debes.");
      const data = { nombre, saldo, tea: Math.max(0, parseAmount(document.getElementById("edTea").value)), minimo: round2(Math.max(0, parseAmount(document.getElementById("edMinimo").value))) };
      if (edId) Object.assign(state.deudas.find((v) => v.id === edId), data); else state.deudas.push({ id: "d" + uid(), ...data });
    }
    save(); closeEditor(); render(); toast("Guardado");
  });
  document.getElementById("edDelete").addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "Toca otra vez para eliminar"; return; }
    if (edKind === "meta") state.metas = state.metas.filter((v) => v.id !== edId);
    else state.deudas = state.deudas.filter((v) => v.id !== edId);
    save(); closeEditor(); render(); toast("Eliminado");
  });

  /* ---------- Eventos de las vistas ---------- */
  const progDlg = document.getElementById("progreso");
  const celDlg = document.getElementById("celebra");
  document.getElementById("streakChip").addEventListener("click", () => goView("hoy"));
  document.getElementById("lvlBtn").addEventListener("click", () => {
    renderProgreso();
    if (typeof progDlg.showModal === "function") progDlg.showModal(); else progDlg.setAttribute("open", "");
  });
  progDlg.addEventListener("click", (e) => { if (e.target === progDlg || e.target.closest("[data-close-prog]")) progDlg.close ? progDlg.close() : progDlg.removeAttribute("open"); });
  celDlg.addEventListener("click", (e) => { if (e.target === celDlg || e.target.closest("[data-close-celebra]")) { celDlg.close ? celDlg.close() : celDlg.removeAttribute("open"); render(); } });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "askName") return;
    e.preventDefault();
    const v = document.getElementById("askNameInput").value.trim();
    if (!v) return;
    state.nombre = v; save(); render(); sonar("moneda");
    toast(`¡Hola, ${v}!`);
  });
  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    goView(b.dataset.tab);
  });
  document.getElementById("prevMonth").addEventListener("click", () => { current = shiftMonth(current, -1); render(); });
  document.getElementById("nextMonth").addEventListener("click", () => { current = shiftMonth(current, 1); render(); });

  // Acciones compartidas entre vistas (botones con data-*).
  document.querySelector(".wrap").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if (d.go) goView(d.go);
    else if (d.pay) payFijo(d.pay);
    else if (d.undoFijo) {
      const m = getMonth(current, false);
      const last = m && [...m.movs].filter((x) => x.tipo === "gasto" && x.cat === d.undoFijo).sort((a, b) => a.id.localeCompare(b.id)).pop();
      if (last) { removeMov(last.id); render(); toast(`Se deshizo el pago de ${money(last.monto)}`); }
    }
    else if (d.payDeuda) payDeuda(d.payDeuda);
    else if (d.save) { const s = summary(monthView(current), current); openSheet({ tipo: "ahorro", sel: defaultMetaId(), monto: Math.max(0, s.ahorroPlan - s.ahorro) }); }
    else if (d.metaSave) saveToMeta(d.metaSave);
    else if (d.editMeta) openEditor("meta", d.editMeta);
    else if (d.newMeta) openEditor("meta");
    else if (d.editDeuda) openEditor("deuda", d.editDeuda);
    else if (d.newDeuda) openEditor("deuda");
    else if (d.estrategia) { state.estrategia = d.estrategia; save(); render(); }
    else if (d.act === "crearFondo") {
      const fijos = summary(monthView(current), current).fijosTotal;
      if (!state.metas.some(esFondo)) state.metas.unshift({ id: "fondo", nombre: "Fondo de emergencia", objetivo: round2(fijos * 3), fecha: "", base: 0 });
      save(); goView("plan"); toast("Meta creada");
    }
    else if (d.act === "noName") { state.nombre = ""; save(); render(); }
    else if (d.act === "usarSugerido") { getMonth(current, true).ahorroPlan = sugeridoAhorro(current); save(); render(); toast("Plan de ahorro actualizado"); }
  });

  document.getElementById("view-hoy").addEventListener("click", (e) => {
    const q = e.target.closest("[data-quick]");
    if (q) { current = thisMonth(); openSheet({ tipo: "gasto", sel: q.dataset.quick, fecha: todayISO() }); return; }
    if (e.target.closest("[data-close]")) {
      const today = todayISO();
      state.cierres[today] = true;
      const n = streak();
      let protector = false;
      if (n % 7 === 0 && state.ultimoProtector !== today && (state.protectores || 0) < 2) { state.protectores = (state.protectores || 0) + 1; state.ultimoProtector = today; protector = true; }
      save(); render();
      sonar("cierre"); vibrar([20, 40, 30]); confeti();
      toast(protector ? `¡${n} días! Ganaste un protector de racha` : n > 1 ? `Día cerrado: ${n} días seguidos · +10 de brillo` : "Día cerrado · +10 de brillo");
      return;
    }
    if (e.target.closest("[data-reopen]")) { delete state.cierres[todayISO()]; save(); render(); }
  });

  document.getElementById("view-plan").addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "planAhorroMes") { const m = getMonth(current, true); if (t.value.trim() === "") delete m.ahorroPlan; else m.ahorroPlan = round2(Math.max(0, parseAmount(t.value))); }
    else if (t.id === "ahorroDefault") state.ahorroMensual = round2(Math.max(0, parseAmount(t.value)));
    else if (t.id === "deudaPresupuesto") state.deudaPresupuesto = round2(Math.max(0, parseAmount(t.value)));
    else return;
    save(); render(); toast("Guardado");
  });

  // Historial: borrar con confirmación en dos toques
  let armed = null, armTimer;
  document.getElementById("view-movimientos").addEventListener("click", (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (armed !== b.dataset.del) {
      armed = b.dataset.del; b.textContent = "¿Seguro?"; b.classList.add("arm");
      clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 3000);
      return;
    }
    removeMov(armed);
    armed = null; clearTimeout(armTimer); render(); toast("Movimiento borrado");
  });

  // Ajustes
  function applyFijosToCurrent() {
    const m = getMonth(current, true);
    const spent = summary(m, current).spentBy;
    const kept = m.presupuesto.filter((p) => state.fijos.some((f) => f.id === p.id) || spent[p.id]);
    m.presupuesto = state.fijos.map((f) => ({ ...f })).concat(kept.filter((p) => !state.fijos.some((f) => f.id === p.id)));
  }

  const ajustes = document.getElementById("view-ajustes");
  ajustes.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "nombreInput") state.nombre = t.value.trim();
    else if (t.id === "sonidoInput") { state.sonido = t.checked; if (t.checked) sonar("moneda"); }
    else if (t.id === "ingresoMes") { getMonth(current, true).ingreso = Math.max(0, parseAmount(t.value)); state.ingresoBase = getMonth(current, true).ingreso; }
    else if (t.dataset.fname) { const f = state.fijos.find((x) => x.id === t.dataset.fname); if (f) f.nombre = t.value.trim() || f.nombre; applyFijosToCurrent(); }
    else if (t.dataset.fmonto) { const f = state.fijos.find((x) => x.id === t.dataset.fmonto); if (f) f.monto = Math.max(0, parseAmount(t.value)); applyFijosToCurrent(); }
    else return;
    save(); render(); toast("Guardado");
  });
  ajustes.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.fdel) {
      state.fijos = state.fijos.filter((f) => f.id !== t.dataset.fdel);
      applyFijosToCurrent(); save(); render(); toast("Gasto fijo quitado");
    } else if (t.id === "addFijo") {
      const id = "f" + uid();
      state.fijos.push({ id, nombre: "Nuevo gasto", monto: 0 });
      applyFijosToCurrent(); save(); render();
      const inp = document.getElementById("fn-" + id); if (inp) { inp.focus(); inp.select(); }
    } else if (t.id === "copyBackup") {
      const text = JSON.stringify(state);
      try { await navigator.clipboard.writeText(text); toast("Respaldo copiado"); }
      catch (err) { const ta = document.getElementById("restoreText"); ta.value = text; ta.select(); toast("Selecciona y copia el texto"); }
    } else if (t.id === "downloadCsv") {
      const rows = [["fecha", "tipo", "detalle", "monto", "nota"]];
      for (const [, m] of Object.entries(state.meses).sort()) for (const mv of m.movs) rows.push([mv.fecha, mv.tipo, movLabel(m, mv), String(mv.monto), mv.nota || ""]);
      const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
      a.download = "sol-a-sol-movimientos.csv";
      document.body.appendChild(a); a.click(); a.remove();
      toast("CSV listo");
    } else if (t.id === "restoreBtn") {
      try {
        const data = JSON.parse(document.getElementById("restoreText").value);
        if (!data || data.version !== 1 || !Array.isArray(data.fijos) || typeof data.meses !== "object") throw new Error("formato");
        state = migrate(data); save(); render(); toast("Respaldo restaurado");
      } catch (err) { toast("Ese texto no es un respaldo válido"); }
    } else if (t.id === "resetBtn") {
      if (!t.classList.contains("arm")) { t.classList.add("arm"); t.textContent = "Toca otra vez para borrar"; setTimeout(() => { t.classList.remove("arm"); t.textContent = "Borrar todo"; }, 3000); return; }
      state = seed(); save(); render(); toast("Datos reiniciados");
    }
  });

  save();
  goView(view);
  if (pendingToast) toast(pendingToast);

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
})();
</script>
</body>
</html>
