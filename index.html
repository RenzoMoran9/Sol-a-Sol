  document.getElementById("edDelete").addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "Toca otra vez para eliminar"; return; }
    if (edKind === "meta") state.metas = state.metas.filter((v) => v.id !== edId);
    else state.deudas = state.deudas.filter((v) => v.id !== edId);
    save(); closeEditor(); render(); toast("Eliminado");
  });

  /* ---------- Eventos de las vistas ---------- */
  document.querySelector(".tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    view = b.dataset.tab; if (view === "hoy") current = thisMonth(); render(); window.scrollTo(0, 0);
  });
  document.getElementById("prevMonth").addEventListener("click", () => { current = shiftMonth(current, -1); render(); });
  document.getElementById("nextMonth").addEventListener("click", () => { current = shiftMonth(current, 1); render(); });

  // Acciones compartidas entre vistas (botones con data-*).
  document.querySelector(".wrap").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const d = t.dataset;
    if (d.go) { view = d.go; if (view === "hoy") current = thisMonth(); render(); window.scrollTo(0, 0); }
    else if (d.pay) payFijo(d.pay);
    else if (d.undoFijo) {
      const m = getMonth(current, false);
      const last = m && [...m.movs].filter((x) => x.tipo === "gasto" && x.cat === d.undoFijo).sort((a, b) => a.id.localeCompare(b.id)).pop();
      if (last) { removeMov(last.id); render(); toast(`Se deshizo el pago de ${money(last.monto)}`); }
    }
    else if (d.payDeuda) payDeuda(d.payDeuda);
    else if (d.save) { const s = summary(monthView(current), current); openSheet({ tipo: "ahorro", sel: defaultMetaId(), monto: Math.max(0, s.ahorroPlan - s.ahorro) }); }
    else if (d.metaSave) saveToMeta(d.metaSave);
    else if (d.editMeta) openEditor("meta", d.editMeta);
    else if (d.newMeta) openEditor("meta");
    else if (d.editDeuda) openEditor("deuda", d.editDeuda);
    else if (d.newDeuda) openEditor("deuda");
    else if (d.estrategia) { state.estrategia = d.estrategia; save(); render(); }
    else if (d.act === "crearFondo") {
      const fijos = summary(monthView(current), current).fijosTotal;
      if (!state.metas.some(esFondo)) state.metas.unshift({ id: "fondo", nombre: "Fondo de emergencia", objetivo: round2(fijos * 3), fecha: "", base: 0 });
      save(); view = "plan"; render(); toast("Meta creada");
    }
    else if (d.act === "usarSugerido") { getMonth(current, true).ahorroPlan = sugeridoAhorro(current); save(); render(); toast("Plan de ahorro actualizado"); }
  });

  document.getElementById("view-hoy").addEventListener("click", (e) => {
    const q = e.target.closest("[data-quick]");
    if (q) { current = thisMonth(); openSheet({ tipo: "gasto", sel: q.dataset.quick, fecha: todayISO() }); return; }
    if (e.target.closest("[data-close]")) {
      state.cierres[todayISO()] = true; save(); render();
      const n = streak();
      toast(n > 1 ? `Día cerrado. Llevas ${n} días seguidos` : "Día cerrado");
      return;
    }
    if (e.target.closest("[data-reopen]")) { delete state.cierres[todayISO()]; save(); render(); }
  });

  document.getElementById("view-plan").addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "planAhorroMes") { const m = getMonth(current, true); if (t.value.trim() === "") delete m.ahorroPlan; else m.ahorroPlan = round2(Math.max(0, parseAmount(t.value))); }
    else if (t.id === "ahorroDefault") state.ahorroMensual = round2(Math.max(0, parseAmount(t.value)));
    else if (t.id === "deudaPresupuesto") state.deudaPresupuesto = round2(Math.max(0, parseAmount(t.value)));
    else return;
    save(); render(); toast("Guardado");
  });

  // Historial: borrar con confirmación en dos toques
  let armed = null, armTimer;
  document.getElementById("view-movimientos").addEventListener("click", (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (armed !== b.dataset.del) {
      armed = b.dataset.del; b.textContent = "¿Seguro?"; b.classList.add("arm");
      clearTimeout(armTimer); armTimer = setTimeout(() => { armed = null; render(); }, 3000);
      return;
    }
    removeMov(armed);
    armed = null; clearTimeout(armTimer); render(); toast("Movimiento borrado");
  });

  // Ajustes
  function applyFijosToCurrent() {
    const m = getMonth(current, true);
    const spent = summary(m, current).spentBy;
    const kept = m.presupuesto.filter((p) => state.fijos.some((f) => f.id === p.id) || spent[p.id]);
    m.presupuesto = state.fijos.map((f) => ({ ...f })).concat(kept.filter((p) => !state.fijos.some((f) => f.id === p.id)));
  }

  const ajustes = document.getElementById("view-ajustes");
  ajustes.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "ingresoMes") { getMonth(current, true).ingreso = Math.max(0, parseAmount(t.value)); state.ingresoBase = getMonth(current, true).ingreso; }
    else if (t.dataset.fname) { const f = state.fijos.find((x) => x.id === t.dataset.fname); if (f) f.nombre = t.value.trim() || f.nombre; applyFijosToCurrent(); }
    else if (t.dataset.fmonto) { const f = state.fijos.find((x) => x.id === t.dataset.fmonto); if (f) f.monto = Math.max(0, parseAmount(t.value)); applyFijosToCurrent(); }
    else return;
    save(); render(); toast("Guardado");
  });
  ajustes.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.fdel) {
      state.fijos = state.fijos.filter((f) => f.id !== t.dataset.fdel);
      applyFijosToCurrent(); save(); render(); toast("Gasto fijo quitado");
    } else if (t.id === "addFijo") {
      const id = "f" + uid();
      state.fijos.push({ id, nombre: "Nuevo gasto", monto: 0 });
      applyFijosToCurrent(); save(); render();
      const inp = document.getElementById("fn-" + id); if (inp) { inp.focus(); inp.select(); }
    } else if (t.id === "copyBackup") {
      const text = JSON.stringify(state);
      try { await navigator.clipboard.writeText(text); toast("Respaldo copiado"); }
      catch (err) { const ta = document.getElementById("restoreText"); ta.value = text; ta.select(); toast("Selecciona y copia el texto"); }
    } else if (t.id === "downloadCsv") {
      const rows = [["fecha", "tipo", "detalle", "monto", "nota"]];
      for (const [, m] of Object.entries(state.meses).sort()) for (const mv of m.movs) rows.push([mv.fecha, mv.tipo, movLabel(m, mv), String(mv.monto), mv.nota || ""]);
      const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
      a.download = "sol-a-sol-movimientos.csv";
      document.body.appendChild(a); a.click(); a.remove();
      toast("CSV listo");
    } else if (t.id === "restoreBtn") {
      try {
        const data = JSON.parse(document.getElementById("restoreText").value);
        if (!data || data.version !== 1 || !Array.isArray(data.fijos) || typeof data.meses !== "object") throw new Error("formato");
        state = migrate(data); save(); render(); toast("Respaldo restaurado");
      } catch (err) { toast("Ese texto no es un respaldo válido"); }
    } else if (t.id === "resetBtn") {
      if (!t.classList.contains("arm")) { t.classList.add("arm"); t.textContent = "Toca otra vez para borrar"; setTimeout(() => { t.classList.remove("arm"); t.textContent = "Borrar todo"; }, 3000); return; }
      state = seed(); save(); render(); toast("Datos reiniciados");
    }
  });

  save();
  render();
  if (pendingToast) toast(pendingToast);

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
})();
</script>
</body>
</html>
